<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chess Engine</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <a href="https://github.com/" title="GitHub" class="icon-link">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"></path>
          </svg>
        </a>
        <span class="brand">Chess Engine</span>
        <span class="nav">
          <a href="/">Play</a><span class="sep">|</span>
          <a href="https://github.com/">My other projects</a><span class="sep">|</span>
          <a href="https://github.com/">How this works</a>
        </span>
      </div>

      <div class="main">
        <div class="columns">
          <div class="board-column">
            <div class="heading" id="status">White to move</div>

            <div class="board-row">
              <div class="board" id="board"></div>
              <div class="evalbar-wrap">
                <span class="evalbar-label" id="eval-label">&mdash;</span>
                <div class="evalbar" id="eval-bar">
                  <div class="evalbar-black" id="eval-black"></div>
                  <div class="evalbar-white" id="eval-white"></div>
                </div>
              </div>
            </div>

            <div class="button-row button-row--nav">
              <button id="first" title="First move" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20 9 12l10-8v16Z"></path><line x1="5" y1="19" x2="5" y2="5"></line></svg>
              </button>
              <button id="prev" title="Previous move" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
              </button>
              <button id="next" title="Next move" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
              </button>
              <button id="last" title="Last move" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8V4Z"></path><line x1="19" y1="5" x2="19" y2="19"></line></svg>
              </button>
            </div>

            <div class="button-row">
              <button id="new-game" class="text-button" type="button">New Game</button>
            </div>

            <div class="history" id="history"></div>
          </div>

          <div class="engine-column">
            <div class="heading">Engine</div>
            <div class="panel" id="engine-log"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
